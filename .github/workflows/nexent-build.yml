name: Export all nexent images separate tar
on:
  workflow_dispatch:
jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - name: Pull all 4 nexent images
        run: |
          docker pull nexent/nexent-web:v2.7.0
          # 每个镜像单独导出独立tar文件
          docker save -o nexent-web-v2.7.0.tar nexent/nexent-web:v2.7.0
      - name: Upload all tar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexent-web-all-tars
          path: |
            nexent-web-v2.7.0.tar
